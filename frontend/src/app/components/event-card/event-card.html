<div class="w-full max-w-lg bg-gray-900 border-4 border-white p-6 flex flex-col items-center text-center shadow-lg" *ngIf="event">

  <!-- Image Placeholder (Pixel Art Style) -->
  <div class="w-full h-32 bg-gray-700 border-2 border-gray-500 mb-6 flex items-center justify-center text-gray-500 text-xs uppercase tracking-widest">
    [ Scene Image ]
  </div>

  <p class="text-lg md:text-xl mb-8 leading-relaxed font-serif">
    {{ event.description }}
  </p>

  <div class="w-full space-y-3">
    <button
      *ngFor="let choice of event.choices"
      (click)="onChoice(choice.id)"
      class="w-full py-3 px-4 bg-gray-800 border-2 border-white text-white hover:bg-white hover:text-black hover:border-transparent transition-colors text-sm uppercase tracking-wide font-bold"
    >
      {{ choice.text }}
    </button>
  </div>
</div>
