<div class="flex flex-col items-center justify-center min-h-screen bg-gray-800 text-white p-4">
  <div class="max-w-md w-full bg-gray-900 border-4 border-white p-8">
    <h1 class="text-3xl font-bold mb-6 text-center uppercase tracking-widest">New Ruler</h1>

    <div class="mb-4">
      <label class="block text-sm font-bold mb-2 uppercase">Name</label>
      <input type="text" [(ngModel)]="name" class="w-full bg-gray-800 border-2 border-white p-2 text-white focus:outline-none focus:border-yellow-400 placeholder-gray-500" placeholder="Enter Name">
    </div>

    <div class="mb-4">
      <label class="block text-sm font-bold mb-2 uppercase">Type</label>
      <select [(ngModel)]="selectedRulerType" class="w-full bg-gray-800 border-2 border-white p-2 text-white focus:outline-none focus:border-yellow-400">
        <option *ngFor="let type of rulerTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-bold mb-2 uppercase">Traits</label>
      <div class="grid grid-cols-2 gap-2">
        <div *ngFor="let trait of availableTraits" class="flex items-center">
          <input type="checkbox" [(ngModel)]="selectedTraits[trait]" [id]="trait" class="mr-2 h-4 w-4 bg-gray-800 border-2 border-white accent-yellow-400">
          <label [for]="trait" class="cursor-pointer uppercase text-xs">{{ trait }}</label>
        </div>
      </div>
    </div>

    <button (click)="startGame()" [disabled]="isLoading" class="w-full bg-white text-black font-bold py-3 uppercase border-4 border-transparent hover:border-yellow-400 hover:text-yellow-400 hover:bg-black transition-colors">
      {{ isLoading ? 'Loading...' : 'Start Reign' }}
    </button>
  </div>
</div>
