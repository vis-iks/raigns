<div class="flex flex-col items-center justify-center min-h-screen bg-red-900 text-white p-4">
  <div class="max-w-md w-full bg-black border-4 border-white p-8 text-center">
    <h1 class="text-4xl font-bold mb-4 uppercase text-red-500">Game Over</h1>

    <div *ngIf="state">
      <p class="text-xl mb-6">{{ state.death_reason || 'Your reign has ended.' }}</p>

      <div class="mb-8 text-sm text-gray-400">
        <p>Turns Survived: {{ state.turn_count }}</p>
        <p>Ruler: {{ state.character.name }}</p>
      </div>
    </div>

    <button (click)="restart()" class="bg-white text-black font-bold py-3 px-8 uppercase border-4 border-transparent hover:bg-gray-200">
      Play Again
    </button>
  </div>
</div>
