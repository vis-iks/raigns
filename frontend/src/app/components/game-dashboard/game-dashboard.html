<div class="flex flex-col h-screen bg-gray-800 text-white overflow-hidden" *ngIf="state">
  <!-- Stats Header -->
  <app-stats-panel [pillars]="state.pillars"></app-stats-panel>

  <!-- Main Content -->
  <div class="flex-grow flex items-center justify-center p-4">
    <app-event-card
      [event]="state.current_event"
      (choiceMade)="handleChoiceMade($event)">
    </app-event-card>
  </div>

  <!-- Footer/Turn Info -->
  <div class="p-2 text-center text-xs text-gray-500 uppercase">
    Turn: {{ state.turn_count }} | Ruler: {{ state.character.name }}
  </div>
</div>
